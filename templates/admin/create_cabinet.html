{% extends 'base.html' %}

{% block title %}New Cabinet - PickFlow{% endblock %}

{% block content %}

<div class="dashboard-header">
    <h1>New Cabinet Type</h1>
    <p>Define a new cabinet profile</p>
</div>

<div class="form-card">
    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/cabinets/create">

        <div class="form-group">
            <label style="display:flex; justify-content:space-between;">
                Code
                <span id="code-counter" style="color:#9ca3af; font-weight:400;">15</span>
            </label>
            <input type="text" name="code" id="code-input" placeholder="e.g. Cab-A, Cab-B"
                   maxlength="15" required
                   oninput="document.getElementById('code-counter').textContent = 15 - this.value.length">
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" placeholder="e.g. Cabinet Type A" required>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
                <label>Width (inches)</label>
                <input type="number" name="width" placeholder="24" required>
            </div>
            <div class="form-group">
                <label>Height (inches) — optional</label>
                <input type="number" name="height" placeholder="30">
            </div>
        </div>

        <div class="form-group">
            <label>Color</label>
            {% if colors %}
            <select name="color" required>
                <option value="">— Select a color —</option>
                {% for color in colors %}
                <option value="{{ color.name }}">{{ color.name }}</option>
                {% endfor %}
            </select>
            {% else %}
            <select name="color" disabled>
                <option style="color:#999; font-style:italic;">No colors yet — go to Admin → Colors</option>
            </select>
            <p style="font-size:12px; color:#999; margin-top:4px;">
                <a href="/admin/colors" style="color:#4f46e5;">Add colors first</a>
            </p>
            {% endif %}
        </div>

        <div class="form-group" style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" name="is_custom" id="is_custom" 
                   style="width:18px; height:18px;">
            <label for="is_custom" style="margin:0;">
                This is a custom cabinet
            </label>
        </div>

        <div style="display:flex; gap:12px; margin-top:1.5rem;">
            <button type="submit" class="btn-primary">Create & Add Parts</button>
            <a href="/admin/cabinets" class="btn-secondary">Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
