{% extends 'base.html' %}
{% block title %}Change Password - PickFlow{% endblock %}
{% block content %}

<div style="max-width:420px; margin:3rem auto;">
    <h2 style="font-size:1.4rem; font-weight:700; color:#1e1b4b; margin-bottom:1.5rem;">Change Password</h2>

    {% if error %}
    <div style="padding:12px 16px; border-radius:8px; margin-bottom:1rem; font-size:14px;
                background:#fef2f2; border:1px solid #fecaca; color:#dc2626;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" style="display:flex; flex-direction:column; gap:1rem;">
        <div>
            <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;">
                Current Password
            </label>
            <input type="password" name="current_password" required
                style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
                       font-size:14px; box-sizing:border-box;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;">
                New Password
            </label>
            <input type="password" name="new_password" required minlength="6"
                style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
                       font-size:14px; box-sizing:border-box;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;">
                Confirm New Password
            </label>
            <input type="password" name="confirm_password" required minlength="6"
                style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
                       font-size:14px; box-sizing:border-box;">
        </div>
        <div style="display:flex; gap:10px; margin-top:0.5rem;">
            <button type="submit"
                style="flex:1; padding:10px; background:#1e1b4b; color:white; border:none;
                       border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
                Update Password
            </button>
            <a href="/dashboard"
                style="flex:1; padding:10px; background:#f3f4f6; color:#374151; border:1px solid #d1d5db;
                       border-radius:8px; font-size:14px; font-weight:600; text-align:center;
                       text-decoration:none; display:inline-block;">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
