<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PickFlow</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f3f4f6;">
    <div style="background:white; padding:2rem; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:380px;">
        <h2 style="font-size:1.3rem; font-weight:700; color:#1e1b4b; margin-bottom:1.5rem; text-align:center;">Reset Password</h2>

        {% if error %}
        <div style="padding:10px 14px; border-radius:8px; margin-bottom:1rem; font-size:14px;
                    background:#fef2f2; border:1px solid #fecaca; color:#dc2626;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" style="display:flex; flex-direction:column; gap:1rem;">
            <div>
                <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;">Email</label>
                <input type="email" name="email" required
                    style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
                           font-size:14px; box-sizing:border-box;">
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;">New Password</label>
                <input type="password" name="new_password" required
                    style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
                           font-size:14px; box-sizing:border-box;">
            </div>
            <button type="submit"
                style="padding:10px; background:#1e1b4b; color:white; border:none;
                       border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-top:0.5rem;">
                Update Password
            </button>
        </form>
    </div>
</body>
</html>
